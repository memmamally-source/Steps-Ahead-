<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 188 306" width="100%" style="max-width:188px;height:auto" role="img" aria-label="Three-generation pedigree: a grandmother with late cataracts, her son with myotonia at 35, and his son affected at birth."><title>Three-generation pedigree: a grandmother with late cataracts, her son with myotonia at 35, and his son affected at birth.</title><desc>Pedigree. Generation I: I-1 male, unaffected; I-2 female, affected (cataracts 60y). Generation II: II-1 male, affected (proband) (myotonia 35y); II-2 female, unaffected. Generation III: III-1 male, affected (floppy newborn). I-1 and I-2 have II-1. II-1 and II-2 have III-1.</desc><text x="12" y="50" font-size="13" font-weight="600" fill="var(--muted, #6e6e73)" font-family="Inter, system-ui, sans-serif">I</text><text x="12" y="142" font-size="13" font-weight="600" fill="var(--muted, #6e6e73)" font-family="Inter, system-ui, sans-serif">II</text><text x="12" y="234" font-size="13" font-weight="600" fill="var(--muted, #6e6e73)" font-family="Inter, system-ui, sans-serif">III</text><line x1="88" y1="45" x2="124" y2="45" stroke="var(--text, #111111)" stroke-width="1.6"/><line x1="106" y1="45" x2="106" y2="91" stroke="var(--text, #111111)" stroke-width="1.6"/><line x1="73" y1="91" x2="106" y2="91" stroke="var(--text, #111111)" stroke-width="1.6"/><line x1="73" y1="91" x2="73" y2="122" stroke="var(--text, #111111)" stroke-width="1.6"/><line x1="88" y1="137" x2="124" y2="137" stroke="var(--text, #111111)" stroke-width="1.6"/><line x1="106" y1="137" x2="106" y2="183" stroke="var(--text, #111111)" stroke-width="1.6"/><line x1="106" y1="183" x2="106" y2="183" stroke="var(--text, #111111)" stroke-width="1.6"/><line x1="106" y1="183" x2="106" y2="214" stroke="var(--text, #111111)" stroke-width="1.6"/><rect x="58" y="30" width="30" height="30" fill="var(--surface, #ffffff)" stroke="var(--text, #111111)" stroke-width="1.8"/><text x="73" y="75" text-anchor="middle" font-size="11" fill="var(--muted, #6e6e73)" font-family="Inter, system-ui, sans-serif">I-1</text><circle cx="139" cy="45" r="15" fill="var(--text, #111111)" stroke="var(--text, #111111)" stroke-width="1.8"/><text x="139" y="75" text-anchor="middle" font-size="11" fill="var(--muted, #6e6e73)" font-family="Inter, system-ui, sans-serif">I-2 cataracts 60y</text><rect x="58" y="122" width="30" height="30" fill="var(--text, #111111)" stroke="var(--text, #111111)" stroke-width="1.8"/><path d="M 42 162 L 55 151" stroke="var(--text, #111111)" stroke-width="1.8"/><path d="M 55 151 l -7 1 l 4 -6 z" fill="var(--text, #111111)"/><text x="73" y="167" text-anchor="middle" font-size="11" fill="var(--muted, #6e6e73)" font-family="Inter, system-ui, sans-serif">II-1 myotonia 35y</text><circle cx="139" cy="137" r="15" fill="var(--surface, #ffffff)" stroke="var(--text, #111111)" stroke-width="1.8"/><text x="139" y="167" text-anchor="middle" font-size="11" fill="var(--muted, #6e6e73)" font-family="Inter, system-ui, sans-serif">II-2</text><rect x="91" y="214" width="30" height="30" fill="var(--text, #111111)" stroke="var(--text, #111111)" stroke-width="1.8"/><text x="106" y="259" text-anchor="middle" font-size="11" fill="var(--muted, #6e6e73)" font-family="Inter, system-ui, sans-serif">III-1 floppy newborn</text></svg>