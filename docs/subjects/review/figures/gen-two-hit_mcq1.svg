<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 188 306" width="100%" style="max-width:188px;height:auto" role="img" aria-label="Pedigree: the father had retinoblastoma (new in him; his parents unaffected); his son has bilateral retinoblastoma and his daughter is unaffected."><title>Pedigree: the father had retinoblastoma (new in him; his parents unaffected); his son has bilateral retinoblastoma and his daughter is unaffected.</title><desc>Pedigree. Generation I: I-1 male, unaffected; I-2 female, unaffected. Generation II: II-1 male, affected (eye removed); II-2 female, unaffected. Generation III: III-1 male, affected (proband) (both eyes); III-2 female, unaffected. I-1 and I-2 have II-1. II-1 and II-2 have III-1, III-2.</desc><text x="12" y="50" font-size="13" font-weight="600" fill="var(--muted, #6e6e73)" font-family="Inter, system-ui, sans-serif">I</text><text x="12" y="142" font-size="13" font-weight="600" fill="var(--muted, #6e6e73)" font-family="Inter, system-ui, sans-serif">II</text><text x="12" y="234" font-size="13" font-weight="600" fill="var(--muted, #6e6e73)" font-family="Inter, system-ui, sans-serif">III</text><line x1="88" y1="45" x2="124" y2="45" stroke="var(--text, #111111)" stroke-width="1.6"/><line x1="106" y1="45" x2="106" y2="91" stroke="var(--text, #111111)" stroke-width="1.6"/><line x1="73" y1="91" x2="106" y2="91" stroke="var(--text, #111111)" stroke-width="1.6"/><line x1="73" y1="91" x2="73" y2="122" stroke="var(--text, #111111)" stroke-width="1.6"/><line x1="88" y1="137" x2="124" y2="137" stroke="var(--text, #111111)" stroke-width="1.6"/><line x1="106" y1="137" x2="106" y2="183" stroke="var(--text, #111111)" stroke-width="1.6"/><line x1="73" y1="183" x2="139" y2="183" stroke="var(--text, #111111)" stroke-width="1.6"/><line x1="73" y1="183" x2="73" y2="214" stroke="var(--text, #111111)" stroke-width="1.6"/><line x1="139" y1="183" x2="139" y2="214" stroke="var(--text, #111111)" stroke-width="1.6"/><rect x="58" y="30" width="30" height="30" fill="var(--surface, #ffffff)" stroke="var(--text, #111111)" stroke-width="1.8"/><text x="73" y="74" text-anchor="middle" font-size="11" fill="var(--muted, #6e6e73)" font-family="Inter, system-ui, sans-serif">I-1</text><circle cx="139" cy="45" r="15" fill="var(--surface, #ffffff)" stroke="var(--text, #111111)" stroke-width="1.8"/><text x="139" y="74" text-anchor="middle" font-size="11" fill="var(--muted, #6e6e73)" font-family="Inter, system-ui, sans-serif">I-2</text><rect x="58" y="122" width="30" height="30" fill="var(--text, #111111)" stroke="var(--text, #111111)" stroke-width="1.8"/><text x="73" y="166" text-anchor="middle" font-size="11" fill="var(--muted, #6e6e73)" font-family="Inter, system-ui, sans-serif">II-1</text><text x="73" y="178" text-anchor="middle" font-size="9.5" fill="var(--muted, #6e6e73)" font-family="Inter, system-ui, sans-serif">eye removed</text><circle cx="139" cy="137" r="15" fill="var(--surface, #ffffff)" stroke="var(--text, #111111)" stroke-width="1.8"/><text x="139" y="166" text-anchor="middle" font-size="11" fill="var(--muted, #6e6e73)" font-family="Inter, system-ui, sans-serif">II-2</text><rect x="58" y="214" width="30" height="30" fill="var(--text, #111111)" stroke="var(--text, #111111)" stroke-width="1.8"/><path d="M 42 254 L 55 243" stroke="var(--text, #111111)" stroke-width="1.8"/><path d="M 55 243 l -7 1 l 4 -6 z" fill="var(--text, #111111)"/><text x="73" y="258" text-anchor="middle" font-size="11" fill="var(--muted, #6e6e73)" font-family="Inter, system-ui, sans-serif">III-1</text><text x="73" y="270" text-anchor="middle" font-size="9.5" fill="var(--muted, #6e6e73)" font-family="Inter, system-ui, sans-serif">both eyes</text><circle cx="139" cy="229" r="15" fill="var(--surface, #ffffff)" stroke="var(--text, #111111)" stroke-width="1.8"/><text x="139" y="258" text-anchor="middle" font-size="11" fill="var(--muted, #6e6e73)" font-family="Inter, system-ui, sans-serif">III-2</text></svg>