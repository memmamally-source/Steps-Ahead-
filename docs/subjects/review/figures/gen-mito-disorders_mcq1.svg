<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 306" width="100%" style="max-width:320px;height:auto" role="img" aria-label="Three-generation pedigree: affected grandmother; her daughter and son are affected; the daughter’s daughter (proband) is affected and her son is not; the affected son’s daughter is unaffected."><title>Three-generation pedigree: affected grandmother; her daughter and son are affected; the daughter’s daughter (proband) is affected and her son is not; the affected son’s daughter is unaffected.</title><desc>Pedigree. Generation I: I-1 male, unaffected; I-2 female, affected (deaf). Generation II: II-1 male, unaffected; II-2 female, affected (deaf, DM); II-3 male, affected (mild); II-4 female, unaffected. Generation III: III-1 female, affected (proband); III-2 male, unaffected; III-3 female, unaffected. I-1 and I-2 have II-2, II-3. II-1 and II-2 have III-1, III-2. II-3 and II-4 have III-3.</desc><text x="12" y="50" font-size="13" font-weight="600" fill="var(--muted, #6e6e73)" font-family="Inter, system-ui, sans-serif">I</text><text x="12" y="142" font-size="13" font-weight="600" fill="var(--muted, #6e6e73)" font-family="Inter, system-ui, sans-serif">II</text><text x="12" y="234" font-size="13" font-weight="600" fill="var(--muted, #6e6e73)" font-family="Inter, system-ui, sans-serif">III</text><line x1="154" y1="45" x2="190" y2="45" stroke="var(--text, #111111)" stroke-width="1.6"/><line x1="172" y1="45" x2="172" y2="91" stroke="var(--text, #111111)" stroke-width="1.6"/><line x1="139" y1="91" x2="205" y2="91" stroke="var(--text, #111111)" stroke-width="1.6"/><line x1="139" y1="91" x2="139" y2="122" stroke="var(--text, #111111)" stroke-width="1.6"/><line x1="205" y1="91" x2="205" y2="122" stroke="var(--text, #111111)" stroke-width="1.6"/><line x1="88" y1="137" x2="124" y2="137" stroke="var(--text, #111111)" stroke-width="1.6"/><line x1="106" y1="137" x2="106" y2="183" stroke="var(--text, #111111)" stroke-width="1.6"/><line x1="106" y1="183" x2