<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 254 214" width="100%" style="max-width:254px;height:auto" role="img" aria-label="Pedigree: unaffected first-cousin parents (double line) have an affected son, an affected daughter and an unaffected son."><title>Pedigree: unaffected first-cousin parents (double line) have an affected son, an affected daughter and an unaffected son.</title><desc>Pedigree. Generation I: I-1 male, unaffected; I-2 female, unaffected. Generation II: II-1 male, affected (proband); II-2 female, affected; II-3 male, unaffected. I-1 and I-2 (related) have II-1, II-2, II-3.</desc><text x="12" y="50" font-size="13" font-weight="600" fill="var(--muted, #6e6e73)" font-family="Inter, system-ui, sans-serif">I</text><text x="12" y="142" font-size="13" font-weight="600" fill="var(--muted, #6e6e73)" font-family="Inter, system-ui, sans-serif">II</text><line x1="121" y1="45" x2="157" y2="45" stroke="var(--text, #111111)" stroke-width="1.6"/><line x1="121" y1="49" x2="157" y2="49" stroke="var(--text, #111111)" stroke-width="1.6"/><line x1="139" y1="49" x2="139" y2="91" stroke="var(--text, #111111)" stroke-width="1.6"/><line x1="73" y1="91" x2="205" y2="91" stroke="var(--text, #111111)" stroke-width="1.6"/><line x1="73" y1="91" x2="73" y2="122" stroke="var(--text, #111111)" stroke-width="1.6"/><line x1="139" y1="91" x2="139" y2="122" stroke="var(--text, #111111)" stroke-width="1.6"/><line x1="205" y1="91" x2="205" y2="122" stroke="var(--text, #111111)" stroke-width="1.6"/><rect x="91" y="30" width="30" height="30" fill="var(--surface, #ffffff)" stroke="var(--text, #111111)" stroke-width="1.8"/><text x="106" y="75" text-anchor="middle" font-size="11" fill="var(--muted, #6e6e73)" font-family="Inter, system-ui, sans-serif">I-1</text><circle cx="172" cy="45" r="15" fill="var(--surface, #ffffff)" stroke="var(--text, #111111)" stroke-width="1.8"/><text x="172" y="75" text-anchor="middle" font-size="11" fill="var(--muted, #6e6e73)" font-family="Inter, system-ui, sans-serif">I-2</text><rect x="58" y="122" width="30" height="30" fill="var(--text, #111111)" stroke="var(--text, #111111)" stroke-width="1.8"/><path d="M 42 162 L 55 151" stroke="var(--text, #111111)" stroke-width="1.8"/><path d="M 55 151 l -7 1 l 4 -6 z" fill="var(--text, #111111)"/><text x="73" y="167" text-anchor="middle" font-size="11" fill="var(--muted, #6e6e73)" font-family="Inter, system-ui, sans-serif">II-1</text><circle cx="139" cy="137" r="15" fill="var(--text, #111111)" stroke="var(--text, #111111)" stroke-width="1.8"/><text x="139" y="167" text-anchor="middle" font-size="11" fill="var(--muted, #6e6e73)" font-family="Inter, system-ui, sans-serif">II-2</text><rect x="190" y="122" width="30" height="30" fill="var(--surface, #ffffff)" stroke="var(--text, #111111)" stroke-width="1.8"/><text x="205" y="167" text-anchor="middle" font-size="11" fill="var(--muted, #6e6e73)" font-family="Inter, system-ui, sans-serif">II-3</text></svg>